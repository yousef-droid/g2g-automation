name: G2G Stealth Automation (Continuous)

on:
  schedule:
    # سيحاول جيت هاب إطلاق السكريبت على رأس كل ساعة
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: g2g-stealth-group
  # لو جيت هاب حاول يشغل السكريبت ولقاه أصلاً شغال (لأنه بيقعد 5 ساعات و45 دقيقة)، هيسيبه يكمل ومش هيفصله
  cancel-in-progress: false 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Packages
        run: npm install axios

      - name: Start Stealth Bot
        env:
          G2G_COOKIES: ${{ secrets.G2G_COOKIES }}
        run: node bot.js
