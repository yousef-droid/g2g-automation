name: Stores Stealth Automation (Continuous)

on:
  schedule:
    # يحاول التشغيل كل ساعة للتأكد من استمرار العمل
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: stores-stealth-group
  # يمنع إيقاف السكربت القديم إذا كان يعمل بالفعل
  cancel-in-progress: false 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Packages
        run: npm install axios

      - name: Start Stealth Bot
        env:
          G2G_COOKIES: ${{ secrets.G2G_COOKIES }}
          FUNPAY_COOKIES: ${{ secrets.FUNPAY_COOKIES }}
        run: node bot.js
