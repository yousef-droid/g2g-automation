name: G2G Stealth Automation

on:
  schedule:
    # يحاول التشغيل كل 30 دقيقة
    - cron: '*/30 * * * *'
  workflow_dispatch:

# منع التداخل: إذا كان السكربت القديم يعمل، يتم تجاهل التشغيل الجديد تماماً
concurrency:
  group: g2g-stealth-group
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Packages
        run: npm install axios

      - name: Start Stealth Bot
        env:
          G2G_COOKIES: ${{ secrets.G2G_COOKIES }}
        run: node bot.js
