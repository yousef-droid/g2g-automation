name: G2G Stealth Automation (3-Hour Cycle)

on:
  schedule:
    # يحاول تشغيل نفسه تلقائياً كل 3 ساعات
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: g2g-stealth-group
  # هذا الأمر هو ما يضمن أنه إذا وجد السكريبت يعمل بالفعل، لن يتدخل لإلغائه
  cancel-in-progress: false 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Packages
        run: npm install axios

      - name: Start Stealth Bot
        env:
          G2G_COOKIES: ${{ secrets.G2G_COOKIES }}
        run: node bot.js
