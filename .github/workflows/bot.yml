name: Stores Stealth Automation (Continuous)

on:
  schedule:
    # يحاول التشغيل كل ساعة للتأكد من استمرار العمل
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'اختبار سريع: دورة واحدة (Ping + محاولة Boost لكل الفئات) ثم خروج'
        type: boolean
        default: false

permissions:
  contents: read
  # مطلوبة عشان السكربت يشغّل النسخة اللي بعده تلقائياً قبل ما يخلص (بدون فجوات Offline)
  actions: write

concurrency:
  group: stores-stealth-group
  # يمنع إيقاف السكربت القديم إذا كان يعمل بالفعل
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Packages
        run: npm install --omit=dev --no-audit --no-fund

      - name: Start Stealth Bot
        env:
          G2G_COOKIES: ${{ secrets.G2G_COOKIES }}
          FUNPAY_COOKIES: ${{ secrets.FUNPAY_COOKIES }}
          # اختياري: تنبيهات تيليجرام
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # اختياري: تغيير الفئات بدون تعديل الكود (Settings > Variables)
          FUNPAY_RAISE_NODES: ${{ vars.FUNPAY_RAISE_NODES }}
          FUNPAY_GAME_IDS: ${{ vars.FUNPAY_GAME_IDS }}
          # G2G (اختياري): توكن مؤقت للاختبار فقط، وصلاحيته 15 دقيقة
          G2G_ACCESS_TOKEN: ${{ secrets.G2G_ACCESS_TOKEN }}
          G2G_USER_ID: ${{ vars.G2G_USER_ID }}
          G2G_AUTO_REFRESH: ${{ vars.G2G_AUTO_REFRESH }}
          G2G_LIST_ORDER_URL: ${{ vars.G2G_LIST_ORDER_URL }}
          TEST_MODE: ${{ inputs.test_mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bot.js
